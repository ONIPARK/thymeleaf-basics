<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>ユーザー一覧</title>
        <style>
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #4CAF50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn {
            display: inline-block;
            background-color: #4CAF50;
            color: white;
            padding: 8px 16px;
            text-decoration: none;
            border-radius: 4px;
            margin-bottom: 15px;
        }
        .btn:hover { background-color: #45a049; }
        </style>
    </head>
    <body>
        <h1>ユーザー一覧</h1>

        <!-- 新規登録ボタン -->
         <a th:href="@{/users/new}" class="btn">+ 新規登録</a>
        
        <!-- 件数を表示 -->
        <p th:if="${totalCount > 0}">
            全 <span th:text="${totalCount}">0</span> 件のユーザーがいます。
        </p>
        <p th:unless="${totalCount > 0}">
            ユーザーが登録されていません。
        </p>

        <!-- ユーザーテーブル -->
         <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>氏名</th>
                    <th>メールアドレス</th>
                    <th>部署</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- th:each でリストをループ -->
                 <!-- チャレンジ 2: 偶数行に背景色を付ける -->
                 <tr th:each="user, stat : ${users}"
                 th:class="${stat.even} ? 'even-row' : 'odd-row'">
                    <td th:text="${user.id}">1</td>
                    <td th:text="${user.name}">サンプル名</td>
                    <!-- チャレンジ 3: メールアドレスリンク -->
                    <td>
                        <span th:text="${user.email}">@example.com</span>
                         <a th:href="@{'mailto:' + ${user.email}}">メール送信</a>
                    </td>
                    <td th:text="${user.department}">部署名</td>
                    <td>
                        <a th:href="@{/users/{id}(id=${user.id})}">詳細</a>
                    </td>
                 </tr>
            </tbody>
         </table>

         <hr>
         <a th:href="@{/}">トップベースに戻る</a>
    </body>
</html>
