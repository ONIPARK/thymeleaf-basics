<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>TODO登録</title>
    <style>
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .error-message {
            color: #f44336;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-secondary {
            background-color: #9e9e9e;
            color: white;
            text-decoration: none;
            display: inline-block;
        }
    </style>
</head>
<body>
    <!-- ヘッダーフラグメント -->
    <div th:replace="~{fragments/header :: header}"></div>
    
    <main style="padding: 0 20px;">
        <div class="form-container">
            <h2>📝 新しいTODOを追加</h2>
            
            <form th:action="@{/todos}" th:object="${todoForm}" method="post">
                <div class="form-group">
                    <label for="title">タイトル <span style="color: red;">*</span></label>
                    <input type="text" id="title" th:field="*{title}" 
                           placeholder="例: 買い物に行く"
                           th:classappend="${#fields.hasErrors('title')} ? 'error' : ''">
                    <p class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">エラーメッセージ</p>
                </div>
                
                <div class="form-group">
                    <label for="description">説明（任意）</label>
                    <textarea id="description" th:field="*{description}" 
                              placeholder="詳細なメモを入力できます"></textarea>
                    <p class="error-message" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">エラーメッセージ</p>
                </div>
                
                <div>
                <label for="dueDate">期限日</label>
                <input type="date" id="dueDate" th:field="*{dueDate}">
                </div>  

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">✅ 登録する</button>
                    <a th:href="@{/todos}" class="btn btn-secondary">キャンセル</a>
                </div>
            </form>
        </div>
    </main>
    
    <!-- フッターフラグメント -->
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
